{% extends "base.html" %}

{% block content %}
<div class="login-wrap">
  <form class="login-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Вход для сотрудников</h1>
    {% if error %}
      <div class="flash flash-danger" style="animation:none;" data-testid="login-error">{{ error }}</div>
    {% endif %}
    <label class="field">Логин
      <input class="input" name="username" autofocus data-testid="login-username">
    </label>
    <label class="field">Пароль
      <input class="input" type="password" name="password" data-testid="login-password">
    </label>
    <button class="btn btn-accent btn-block" type="submit" data-testid="login-submit">Войти</button>
  </form>
</div>
{% endblock %}
