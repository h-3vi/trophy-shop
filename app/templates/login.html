
{% extends "base.html" %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">🎣</div>

        <div class="auth-heading">
            <h1>Добро пожаловать!</h1>
            <p>Войдите в свой аккаунт магазина «Трофей»</p>
        </div>

        {% if error %}
        <div class="auth-error" data-testid="login-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="auth-form">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="auth-field">
                <label for="email">
                    Электронная почта
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="example@mail.ru"
                    value="{{ request.form.get('email', '') }}"
                    maxlength="120"
                    autocomplete="email"
                    data-testid="login-email"
                    required
                >
            </div>

            <div class="auth-field">
                <label for="password">
                    Пароль
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Введите пароль"
                    autocomplete="current-password"
                    data-testid="login-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="auth-button"
                data-testid="login-submit"
            >
                Войти
            </button>

        </form>

        <div class="auth-divider">
            <span>Нет аккаунта?</span>
        </div>

        <a
            href="{{ url_for('auth.register') }}"
            class="auth-outline-button"
        >
            Зарегистрироваться
        </a>

        <p class="auth-help">
            Сотрудники магазина входят через эту же форму.
        </p>

    </div>

</section>

{% endblock %}
